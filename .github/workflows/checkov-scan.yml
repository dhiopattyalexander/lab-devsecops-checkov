name: "IaC Security Scan"

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "dockerfile/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Checkov - Terraform"
        id: checkov_terraform
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: terraform/
          framework: terraform
          check: CKV_AWS_20,CKV_AWS_57,CKV_AWS_145,CKV_AWS_21,CKV_AWS_24,CKV_AWS_25,CKV_AWS_27,CKV_AWS_17,CKV_AWS_8,CKV_AWS_79,CKV_AWS_62
          output_format: cli,sarif
          output_file_path: console,checkov-terraform.sarif
          soft_fail: false

      - name: "Run Checkov - Kubernetes"
        id: checkov_k8s
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: kubernetes/
          framework: kubernetes
          output_format: cli,sarif
          output_file_path: console,checkov-k8s.sarif
          soft_fail: true

      - name: "Run Checkov - Dockerfile"
        id: checkov_dockerfile
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: dockerfile/
          framework: dockerfile
          output_format: cli,sarif
          output_file_path: console,checkov-dockerfile.sarif
          soft_fail: true

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-terraform.sarif') != ''
        with:
          sarif_file: checkov-terraform.sarif
          category: "checkov-terraform"

      - name: "Block pipeline jika ditemukan pelanggaran di Terraform"
        if: always() && steps.checkov_terraform.outcome == 'failure'
        run: |
          echo "❌ Checkov menemukan pelanggaran keamanan pada Terraform!"
          echo "Periksa log job atau tab Security -> Code scanning untuk detail."
          exit 1

      - name: "Report sukses"
        if: always() && steps.checkov_terraform.outcome == 'success'
        run: |
          echo "✅ Seluruh pemeriksaan Checkov pada Terraform PASSED!"
